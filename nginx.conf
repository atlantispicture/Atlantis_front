server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA — 어떤 경로로 들어와도 index.html 을 준다
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 빌드 산출물은 파일명에 해시가 붙어 있어 영구 캐시가 안전하다
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 지리 데이터(약 25MB) — Natural Earth 스냅샷이라 내용이 바뀌지 않는다.
    # 방문할 때마다 다시 받지 않도록 길게 잡는다. 갱신 시엔 파일명을 바꾼다.
    location /geo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 은 항상 최신을 받아야 새 배포가 반영된다
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
